blueprint:
  id: wax-account-permission-auditor
  name: Account Permission Auditor
  tier: 1
  category: security-auditing
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-18"

metadata:
  description: |
    Pure rule-based audit of Antelope permission structures. Findings depend on
    thresholds/keys/accounts — never account name hard-codes.
  related_blueprints:
    - wax-permission-visualizer-and-editor
    - wax-safe-key-rotation-assistant
    - wax-multi-sig-proposal-builder-and-simulator

invariants:
  - Rules pure given AccountPermissions
  - No name-based branching for findings
  - Findings include recommendations

features:
  implemented:
    - auditPermissionLevel, auditAccountPermissions, auditMany
    - weak/strong demos, AuditResultCard
  planned:
    - get_account RPC adapter
    - heatmap visualization

machine_instructions:
  - Use examples/engines.ts
  - Map chain authority tables at the app edge only

technical_requirements:
  framework: Next.js + TypeScript
  styling: Tailwind CSS
